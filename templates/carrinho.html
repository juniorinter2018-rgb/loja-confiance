<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sua Sacola | Confiance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- PALETA VISUAL CONFIANCE --- */
        :root {
            --pessego: #FFDAB9; --rosa-antigo: #C08081; 
            --ciano: #BBDDE6;
            --texto-escuro: #3E3B3B; --fundo-site: #F9F4EF; --fundo-card: #FFFEFA;
            --sombra: rgba(192, 128, 129, 0.15); --borda: rgba(0,0,0,0.05);
            --verde-zap: #25D366; --verde-zap-hover: #128C7E;
            --azul-mp: #009EE3; 
        }

        body.dark-mode {
            --pessego: #A07060; --rosa-antigo: #D09091; --ciano: #2F4F4F;
            --texto-escuro: #E0E0E0; --fundo-site: #121212; --fundo-card: #1E1E1E;
            --sombra: rgba(0,0,0,0.5); --borda: rgba(255,255,255,0.05);
        }
        body.dark-mode .logo-img { filter: invert(1); }
        body.dark-mode .top-bar { background-color: #222; }
        body.dark-mode .search-input { background-color: #333; color: white; }
        body.dark-mode .cart-item, body.dark-mode .cart-summary { background-color: #1E1E1E; border-color: #333; }
        body.dark-mode .frete-radio-label:hover { background-color: #333; }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Lato', sans-serif; color: var(--texto-escuro); background-color: var(--fundo-site); }

        /* HEADER PADRÃO */
        .top-bar { background-color: black; color: white; text-align: center; padding: 8px 0; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: var(--fundo-card); border-bottom: 1px solid rgba(0,0,0,0.05); gap: 30px; position: sticky; top: 0; z-index: 100; }
        .brand-link { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
        .logo-img { height: 50px; width: auto; display: block; transition: filter 0.3s; }
        .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: bold; color: var(--rosa-antigo); letter-spacing: 2px; text-transform: uppercase; display: block; }
        @media(max-width: 768px) { .brand-name { display: none; } }

        .search-box { flex-grow: 1; max-width: 600px; position: relative; }
        .search-input { width: 100%; padding: 12px 20px; padding-right: 50px; border: none; border-radius: 4px; background-color: #F0F0F0; color: var(--texto-escuro); font-family: 'Lato', sans-serif; outline: none; }
        .search-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; }
        .nav-right { display: flex; gap: 25px; align-items: center; flex-shrink: 0; }
        .icon-group { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--texto-escuro); font-size: 0.85rem; line-height: 1.2; text-decoration: none; }
        .icon-group svg { width: 24px; height: 24px; stroke-width: 2; } 
        .icon-text { display: block; font-weight: bold; }
        .icon-sub { font-size: 0.75rem; font-weight: normal; display: block; color: #888; }
        @media(max-width: 1000px) { .icon-text, .icon-sub { display: none; } }
        .btn-theme { background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        .category-bar { display: flex; justify-content: center; gap: 30px; padding: 15px 0; background-color: var(--fundo-card); border-bottom: 1px solid rgba(0,0,0,0.05); box-shadow: 0 2px 5px rgba(0,0,0,0.02); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; overflow-x: auto; white-space: nowrap; }
        .cat-link { color: var(--texto-escuro); text-decoration: none; padding: 5px 0; transition: color 0.2s; }
        .cat-link:hover { color: var(--rosa-antigo); } .cat-link.highlight { color: #D32F2F; }

        /* LAYOUT CARRINHO */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 20px; color: var(--rosa-antigo); border-bottom: 1px solid var(--borda); padding-bottom: 15px; }
        
        .progress-container { width: 100%; max-width: 600px; margin: 0 auto 40px auto; }
        .progress-labels { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .label-active { color: var(--rosa-antigo); }
        .progress-track { width: 100%; height: 6px; background-color: #eee; border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 50%; height: 100%; background-color: var(--rosa-antigo); }

        .cart-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 40px; }
        @media(max-width: 900px) { .cart-grid { grid-template-columns: 1fr; } }

        .cart-items-container { display: flex; flex-direction: column; gap: 20px; }
        .cart-item { display: flex; align-items: center; background: var(--fundo-card); padding: 20px; border-radius: 4px; box-shadow: 0 5px 15px var(--sombra); border: 1px solid var(--borda); }
        .item-img { width: 90px; height: 110px; object-fit: cover; border-radius: 4px; margin-right: 20px; }
        .item-details { flex-grow: 1; }
        .item-name { font-weight: bold; font-size: 1.2rem; font-family: 'Cormorant Garamond', serif; margin-bottom: 5px; }
        .item-meta { font-size: 0.9rem; color: #888; margin-bottom: 8px; }
        .btn-remove { color: #D32F2F; font-size: 0.8rem; cursor: pointer; text-decoration: underline; border: none; background: none; padding: 0; }
        .item-price { font-weight: bold; font-size: 1.2rem; color: var(--texto-escuro); }

        /* RESUMO E FRETE */
        .cart-summary { background: var(--fundo-card); padding: 35px; border-radius: 4px; box-shadow: 0 10px 30px var(--sombra); height: fit-content; border: 1px solid var(--borda); position: sticky; top: 120px; }
        .summary-title { font-size: 1.8rem; font-family: 'Cormorant Garamond', serif; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; color: var(--texto-escuro); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1rem; color: #555; }
        
        .frete-calculator { margin: 25px 0; border-top: 1px dashed #ddd; border-bottom: 1px dashed #ddd; padding: 20px 0; }
        .cep-input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        #cep-carrinho { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white; color: var(--texto-escuro); }
        .btn-ok-frete { background: var(--texto-escuro); color: white; border: none; padding: 0 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .frete-options { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
        .frete-radio-label { display: flex; justify-content: space-between; cursor: pointer; align-items: center; padding: 10px; border-radius: 4px; transition: background 0.2s; font-size: 0.9rem; border: 1px solid transparent; }
        .frete-radio-label:hover { background: rgba(0,0,0,0.03); border-color: #eee; }
        .frete-radio-label input { margin-right: 10px; accent-color: var(--rosa-antigo); }

        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-weight: bold; font-size: 1.6rem; color: var(--rosa-antigo); font-family: 'Cormorant Garamond', serif; }

        .btn-checkout { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; margin-top: 15px; background-color: var(--verde-zap); color: white; border: none; border-radius: 30px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s; font-size: 1rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-checkout:hover { background-color: var(--verde-zap-hover); transform: translateY(-2px); }
        
        .btn-mp { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; margin-top: 30px; background-color: var(--azul-mp); color: white; border: none; border-radius: 30px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s; font-size: 1rem; box-shadow: 0 4px 15px rgba(0, 158, 227, 0.3); }
        .btn-mp:hover { filter: brightness(0.9); transform: translateY(-2px); }
        .btn-mp:disabled { background-color: #ccc; cursor: not-allowed; }

        .empty-cart { text-align: center; padding: 80px 20px; grid-column: 1 / -1; color: #888; }
        footer { background-color: var(--fundo-card); text-align: center; padding: 40px; border-top: 5px solid var(--rosa-antigo); margin-top: 60px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="top-bar">Frete grátis em compras acima de R$ 279,99</div>
    
    <nav>
        <a href="/" class="brand-link">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img">
            <span class="brand-name">Confiance</span>
        </a>
        <form action="/" method="GET" class="search-box">
            <input type="text" name="q" class="search-input" placeholder="Busque por produto...">
            <button type="submit" class="search-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </form>
        <div class="nav-right">
            <a href="/favoritos" class="icon-group">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <div><span class="icon-sub">Confira seus</span><span class="icon-text">Favoritos</span></div>
            </a>
            <a href="/carrinho" class="icon-group">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
            <button class="btn-theme" id="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="category-bar">
        <a href="#" class="cat-link highlight">Black Friday</a>
        <a href="#" class="cat-link">Feminino</a>
        <a href="#" class="cat-link">Masculino</a>
        <a href="#" class="cat-link">Infantil</a>
        <a href="#" class="cat-link">Beleza</a>
        <a href="#" class="cat-link">Esportivo</a>
        <a href="#" class="cat-link">Jeans</a>
        <a href="#" class="cat-link">Novidades</a>
    </div>

    <div class="container">
        <div class="progress-container">
            <div class="progress-labels">
                <span class="label-active">1. Sacola</span>
                <span>2. Identificação</span>
                <span>3. Pagamento</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <h1 class="page-title">Minha Sacola</h1>
        <div class="cart-grid" id="cart-content"></div>
    </div>

    <footer>
        <p>CATRACA GROUP &copy; 2025</p>
        <p class="orcamento">Faça seu orçamento de site conosco! <a href="https://wa.me/5583987922924" target="_blank">Entre em contato</a></p>
    </footer>

    <script>
        const STATIC_PATH = "/static/";
        let carrinhoAtual = JSON.parse(localStorage.getItem('carrinho_confiance') || '[]');
        let freteSelecionado = 0; 
        let freteNome = "";

        function renderCart() {
            const container = document.getElementById('cart-content');
            
            if (carrinhoAtual.length === 0) {
                container.innerHTML = `<div class="empty-cart"><p>Sua sacola está vazia.</p><a href="/" style="color:var(--rosa-antigo); font-weight:bold;">Voltar às compras</a></div>`;
                return;
            }

            let subtotal = 0;
            let itemsHTML = '<div class="cart-items-container">';
            
            carrinhoAtual.forEach((item, index) => {
                subtotal += item.preco;
                let imgSrc = item.imagem.startsWith('http') ? item.imagem : STATIC_PATH + item.imagem;
                itemsHTML += `
                    <div class="cart-item">
                        <img src="${imgSrc}" class="item-img">
                        <div class="item-details">
                            <div class="item-name">${item.nome}</div>
                            <div class="item-meta">Cor: ${item.corSelecionada || 'Padrão'}</div>
                            <button class="btn-remove" onclick="removeItem(${index})">Remover</button>
                        </div>
                        <div class="item-price">R$ ${item.preco.toFixed(2)}</div>
                    </div>`;
            });
            itemsHTML += '</div>';

            let textoFreteResumo = 'A calcular';
            let areaFreteHTML = '';

            // Regra de Frete Grátis Visual
            if (subtotal >= 279) {
                freteSelecionado = 0; freteNome = "Frete Grátis"; textoFreteResumo = '<span style="color:green; font-weight:bold">GRÁTIS</span>';
                areaFreteHTML = `<div style="margin:20px 0; padding:15px; background:#E8F5E9; color:#2E7D32; border-radius:4px; text-align:center;">🎉 <strong>Parabéns!</strong> Frete Grátis garantido.</div>`;
            } else {
                textoFreteResumo = freteSelecionado > 0 ? `R$ ${freteSelecionado.toFixed(2)}` : 'A calcular';
                areaFreteHTML = `
                    <div class="frete-calculator">
                        <label style="font-size:0.9rem; font-weight:bold;">Calcular Frete:</label>
                        <div class="cep-input-group">
                            <input type="text" id="cep-carrinho" placeholder="Digite seu CEP" maxlength="9">
                            <button class="btn-ok-frete" onclick="calcularFreteCarrinho()">OK</button>
                        </div>
                        <div id="opcoes-frete" class="frete-options">
                            ${freteSelecionado > 0 ? '<span style="color:green">Frete selecionado: R$ ' + freteSelecionado.toFixed(2) + ' ('+ freteNome +')</span>' : '<span style="color:#999; font-style:italic; font-size:0.9rem;">Insira o CEP para ver opções.</span>'}
                        </div>
                    </div>
                `;
            }

            let totalFinal = subtotal + freteSelecionado;

            const summaryHTML = `
                <div class="cart-summary">
                    <div class="summary-title">Resumo do Pedido</div>
                    <div class="summary-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
                    <div class="summary-row"><span>Frete</span><span>${textoFreteResumo}</span></div>

                    ${areaFreteHTML}

                    <div class="summary-total"><span>Total</span><span id="total-final">R$ ${totalFinal.toFixed(2)}</span></div>
                    <div style="margin-top: 10px; font-size: 0.9rem; color: #666; text-align:right;">ou 6x de R$ ${(totalFinal/6).toFixed(2)} sem juros</div>

                    <button class="btn-mp" onclick="finalizarMercadoPago(${subtotal})">
                        Pagar com Mercado Pago 💳
                    </button>

                    <button class="btn-checkout" onclick="finalizarWhatsApp(${subtotal})">
                        Finalizar no WhatsApp 📱
                    </button>
                </div>
            `;

            container.innerHTML = itemsHTML + summaryHTML;
            
            // Máscara CEP
            const cepInput = document.getElementById('cep-carrinho');
            if(cepInput){
                cepInput.addEventListener('keypress', (e) => { if(cepInput.value.length == 5 && e.key !== '-') cepInput.value += '-'; });
                cepInput.addEventListener('input', function() {
                   let val = this.value.replace(/\D/g, '');
                   if (val.length > 5) val = val.slice(0,5) + '-' + val.slice(5,8);
                   this.value = val;
                });
            }
        }

        function removeItem(index) {
            carrinhoAtual.splice(index, 1);
            localStorage.setItem('carrinho_confiance', JSON.stringify(carrinhoAtual));
            freteSelecionado = 0; renderCart(); 
        }

        // --- CÁLCULO MANUAL (SIMPLE) ---
        async function calcularFreteCarrinho() {
            const cep = document.getElementById('cep-carrinho').value;
            const divOpcoes = document.getElementById('opcoes-frete');
            
            if (cep.length < 9) { alert("Digite um CEP válido."); return; }
            divOpcoes.innerHTML = '<span style="color:#888">Consultando...</span>';

            try {
                // Agora enviamos apenas o CEP para a rota simplificada
                const response = await fetch('/api/calcular-frete', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ cep: cep }) 
                });
                
                const opcoes = await response.json();
                
                if(opcoes.erro) { 
                    divOpcoes.innerHTML = `<span style='color:red'>${opcoes.erro}</span>`; 
                    return; 
                }

                let html = '';
                opcoes.forEach((opt) => {
                    let precoFloat = parseFloat(opt.preco);
                    html += `
                    <label class="frete-radio-label">
                        <div style="display:flex; align-items:center">
                            <input type="radio" name="frete" value="${precoFloat}" data-nome="${opt.servico}" onchange="selecionarFrete(this)">
                            <div>
                                <strong style="display:block">${opt.servico}</strong> 
                                <small style="color:#666">${opt.prazo} (${opt.obs})</small>
                            </div>
                        </div>
                        <div style="font-weight:bold; color:var(--rosa-antigo)">${precoFloat === 0 ? 'Grátis' : 'R$ '+precoFloat.toFixed(2)}</div>
                    </label>`;
                });
                divOpcoes.innerHTML = html;

            } catch (e) { 
                divOpcoes.innerHTML = "Erro ao calcular."; 
            }
        }

        window.selecionarFrete = function(radio) {
            freteSelecionado = parseFloat(radio.value);
            freteNome = radio.getAttribute('data-nome');
            renderCart(); 
        };

        window.finalizarWhatsApp = function(subtotalInicial) {
            if (carrinhoAtual.length === 0) return;
            if (subtotalInicial < 279 && freteSelecionado === 0 && freteNome === "") { alert("Por favor, selecione uma opção de frete."); return; }
            
            let msg = "*Novo Pedido - Confiance*\n----------------\n";
            carrinhoAtual.forEach(i => msg += `▪ ${i.nome} (${i.corSelecionada || 'Padrão'}) - R$ ${i.preco.toFixed(2)}\n`);
            
            msg += `\n📦 Envio: ${subtotalInicial >= 279 ? 'FRETE GRÁTIS' : freteNome + ' (R$ '+freteSelecionado.toFixed(2)+')'}`;
            msg += `\n💰 *Total Final: R$ ${(subtotalInicial + freteSelecionado).toFixed(2)}*`;
            
            window.open(`https://wa.me/5583987922924?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.finalizarMercadoPago = async function(subtotalInicial) {
            if (subtotalInicial < 279 && freteSelecionado === 0 && freteNome === "") { 
                alert("Por favor, calcule e selecione o frete antes de pagar."); 
                return; 
            }
            const btn = document.querySelector('.btn-mp');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "Processando..."; btn.disabled = true;

            try {
                const response = await fetch('/api/checkout-mp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carrinho: carrinhoAtual, frete: freteSelecionado })
                });
                const data = await response.json();
                if (data.link_pagamento) {
                    window.location.href = data.link_pagamento;
                } else {
                    alert("Erro: " + (data.erro || "Desconhecido"));
                    btn.innerHTML = textoOriginal; btn.disabled = false;
                }
            } catch (error) {
                alert("Erro de conexão.");
                btn.innerHTML = textoOriginal; btn.disabled = false;
            }
        };

        renderCart();

        // Dark Mode
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') { body.classList.add('dark-mode'); toggleBtn.innerText = '☀️'; }
        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) { localStorage.setItem('theme', 'dark'); toggleBtn.innerText = '☀️'; }
            else { localStorage.setItem('theme', 'light'); toggleBtn.innerText = '🌙'; }
        });
    </script>
</body>
</html>
